<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse Inactivity Detector</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 45px 35px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      border-radius: 50%;
      background: rgba(96, 165, 250, 0.18);
      border: 1px solid rgba(147, 197, 253, 0.4);
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .description {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      margin-bottom: 28px;
      border-radius: 30px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 10px #4ade80;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #60a5fa, #818cf8);
      color: #0f172a;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 25px rgba(96, 165, 250, 0.25);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(96, 165, 250, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    
#toast {
  position: fixed;
  top: 30px;
  right: 30px;
  min-width: 280px;
  max-width: calc(100% - 40px);
  padding: 16px 20px;
  border-radius: 12px;
  color: white;
  background: #16a34a;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  z-index: 1000;
  animation: toast .3s ease;
  overflow: hidden;
}

#toast p {
  font-size: 14px;
  font-weight: 600;
}

#toast.success {
  background: #16a34a;
}

#toast.error {
  background: #dc2626;
}

#line {
  height: 3px;
  margin-top: 12px;
  background: white;
  animation: progress 5s linear forwards;
}

#toast.hide {
  animation: hideToast .8s ease forwards;
}

@keyframes toast {
  from {
    transform: translateX(200px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes hideToast {
  to {
    transform: translateX(200px);
    opacity: 0;
  }
}

@keyframes progress {
  from {
    width: 100%;
  }
  to {
    width: 0%;
  }
}


    @media (max-width: 480px) {
      .container {
        padding: 35px 24px;
      }

      h1 {
        font-size: 26px;
      }

      .description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🖱️</div>

    <h1>Mouse Move</h1>

    <p class="description">
      Stay active! Your session will automatically log out
      when there is no mouse movement for 5 seconds.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      Activity Monitoring
    </div>

    <button id="btn">Login</button>

    <p class="note">
      Move your mouse to keep your session active.
      Inactivity detection runs automatically.
    </p>
  </div>

  <script>
   
let move = true;
let i;
let toastTimer;
let btn = document.getElementById("btn");

btn.innerHTML = "Logout";

function logout() {
  if (!move) return;

  move = false;
  clearTimeout(i);

  btn.innerHTML = "Login";
  toast("error", "You are inactive for 5 seconds!");
}

function moved() {
  if (!move) return;

  clearTimeout(i);

  i = setTimeout(() => {
    logout();
  }, 5000);
}

function toast(type, msg) {
  let oldToast = document.getElementById("toast");

  if (oldToast) {
    oldToast.remove();
  }

  clearTimeout(toastTimer);

  let div = document.createElement("div");
  div.id = "toast";
  div.classList.add(type);

  let p = document.createElement("p");
  p.textContent = msg;

  let divline = document.createElement("div");
  divline.id = "line";

  div.append(p, divline);
  document.body.append(div);

 
toastTimer = setTimeout(() => {
  div.classList.add("hide");

  setTimeout(() => {
    div.remove();
  }, 300);
}, 5000);

}

btn.addEventListener("click", () => {
  if (move) {
    logout();
  } else {
    move = true;
    btn.innerHTML = "Logout";

    toast("success", "Login successful! Activity monitoring started.");

    moved();
  }
});

document.addEventListener("mousemove", moved);

moved();

  </script>
</body>
</html>
